name: Public website live smoke (non-destructive)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production public routes and unauthenticated API boundaries
        run: node scripts/live-smoke.mjs
