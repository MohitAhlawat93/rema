name: Cloudflare domain safety preflight
on:
  push:
    branches: [feat/cloudflare-client-handover]
    paths:
      - 'scripts/cloudflare-domains-preflight.mjs'
      - 'test/cloudflare-domains-preflight.test.mjs'
      - '.github/workflows/cloudflare-domain-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test test/cloudflare-domains-preflight.test.mjs
      - name: Verify real domain response and prelaunch noindex
        run: node scripts/cloudflare-domains-preflight.mjs

      - name: Prove testing and production candidate use independent backend configuration
        run: |
          node --input-type=module <<'NODE'
          const origins={
            testing:'https://test.witnesslema.com',
            candidate:'https://lema-website-production.pages.dev'
          };
          const outcome={};
          for(const [name,base] of Object.entries(origins)){
            outcome[name]={};
            for(const path of ['/api/site-content','/api/reviews']){
              const response=await fetch(base+path,{signal:AbortSignal.timeout(13000)});
              outcome[name][path]=response.status;
            }
          }
          console.log('Backend isolation status codes only:',outcome);
          if(outcome.testing['/api/site-content']!==200||
             outcome.testing['/api/reviews']!==200)
            throw Error('Testing backend appears unavailable; do not promote the website');
          if(![401,503].includes(outcome.candidate['/api/site-content'])||
             ![401,503].includes(outcome.candidate['/api/reviews']))
            throw Error('Production candidate backend is not safely isolated');
          console.log('PASS testing database is live and production database is not yet connected');
          NODE
