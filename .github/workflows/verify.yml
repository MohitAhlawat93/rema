name: Verify website and SEO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: npm run validate:seo
      - name: Verify SEO production-mode output
        run: |
          SEO_INDEXING_ENABLED=true npm run build
          SEO_INDEXING_ENABLED=true npm run validate:seo
