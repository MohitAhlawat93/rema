name: Cloudflare staging — deploy reviewed branch
on:
  workflow_dispatch:
  push:
    branches: [feat/cloudflare-client-handover]
    paths:
      - '.github/workflows/cloudflare-staging.yml'
      - 'wrangler.jsonc'
      - 'scripts/cloudflare-staging-smoke.mjs'
      - 'docs/CLOUDFLARE_MIGRATION.md'
      - 'public/app.js'
      - 'public/admin.js'
      - 'public/admin.html'
      - 'api/admin/**'
      - 'lib/staging-self-test.js'
      - 'tests/staging-self-test.test.mjs'
      - 'scripts/cloudflare-slideshow-qa.mjs'
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-lema-staging
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and website
        run: |
          npm run build
          npm test
          npm run validate:seo
          node --check functions/api/assistant.js
          node --check functions/api/admin/[route].js
      # Re-run automatically whenever this workflow changes after token provisioning.
      - name: Require staging-only API token
        env:
          STAGING_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
        run: |
          if [ -z "$STAGING_TOKEN" ]; then
            echo "::error::Set CF_STAGING_API_TOKEN in GitHub Actions repository secrets before deploying."
            exit 1
          fi
      # The GitHub checkout is the feature branch; branch=main selects only the staging Pages root URL.
      - name: Use protected Cloudflare account settings
        run: |
          # The staging Pages project owns its R2, SEO and Supabase bindings.
          # Do not let a repository example override dashboard variables/secrets.
          mv wrangler.jsonc wrangler.jsonc.example
      - name: Direct Upload to staging (client never receives source)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_STAGING_API_TOKEN }}
          accountId: '13032a1345920c80c9572e3ba6dddeba'
          command: pages deploy dist --project-name=lema-website-staging --branch=main
      - name: Verify deployed Pages routes (read-only)
        run: node scripts/cloudflare-staging-smoke.mjs https://lema-website-staging.pages.dev
      - name: Install Chromium for real slideshow tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify changing published photographs on Cloudflare
        run: node scripts/cloudflare-slideshow-qa.mjs https://lema-website-staging.pages.dev
